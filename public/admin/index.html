<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>TodayInfo Control Center</title>
  <link rel="stylesheet" href="/admin/styles.css">
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>
  <section id="loginView" class="login-shell">
    <div class="login-grid"></div><div class="login-orb one"></div><div class="login-orb two"></div>
    <form id="loginForm" class="login-card">
      <div class="brand-mark">TI</div>
      <p class="eyebrow">TODAYINFO CONTROL CENTER</p>
      <h1>Content control without the clutter.</h1>
      <p class="muted">Fetch → review → structure → publish → measure.</p>
      <label class="field">Username<input name="username" autocomplete="username" value="apo" required></label>
      <label class="field">Password<input name="password" type="password" autocomplete="current-password" value="admin" required></label>
      <button class="primary full" type="submit">Enter dashboard <span>→</span></button>
      <small>Development default: <strong>apo / admin</strong>. Change this before production.</small>
    </form>
  </section>

  <div id="appView" class="app-shell hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark small">TI</span><div><strong>TodayInfo</strong><small>Control Center</small></div></div>
      <nav id="nav">
        <button data-view="overview" class="active"><span>◉</span>Overview</button>
        <p>CONTENT</p>
        <button data-view="sources"><span>⌘</span>Source Hub</button>
        <button data-view="imports"><span>↓</span>Import Inbox <b id="navImportCount">0</b></button>
        <button data-view="demand"><span>⚡</span>Demand Queue <b id="navDemandCount">0</b></button>
        <button data-view="posts"><span>▤</span>Content Library</button>
        <button data-view="media"><span>▧</span>Media & Documents</button>
        <p>INSIGHTS</p>
        <button data-view="analytics"><span>⌁</span>Analytics</button>
        <p>ADMINISTRATION</p>
        <button data-view="team"><span>♙</span>Team & Roles</button>
        <button data-view="settings"><span>⚙</span>Settings</button>
        <button data-view="audit"><span>≋</span>Audit Log</button>
      </nav>
      <div class="sidebar-foot"><div class="live-dot"></div><span>Managed API</span><button id="logoutBtn" title="Log out">↪</button></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn mobile-only" aria-label="Menu">☰</button>
        <div><p class="eyebrow" id="viewEyebrow">COMMAND CENTER</p><h2 id="viewTitle">Overview</h2></div>
        <div class="top-actions"><button id="themeToggle" class="ghost theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch theme"><span aria-hidden="true">☾</span><span class="theme-label">Dark mode</span></button><button id="quickFetch" class="ghost hide-small">↻ Fetch new</button><button id="quickCreate" class="primary">＋ Create</button><span id="roleBadge" class="role-badge"></span><div class="avatar" id="avatar">A</div></div>
      </header>
      <div id="content" class="content"></div>
    </main>
  </div>

  <dialog id="modal" class="modal">
    <div class="modal-box">
      <div class="modal-head"><div><p class="eyebrow" id="modalEyebrow">EDITOR</p><h3 id="modalTitle">Edit</h3></div><button id="modalClose" class="icon-btn" type="button" aria-label="Close">×</button></div>
      <div id="modalBody"></div>
    </div>
  </dialog>
  <script src="/admin/app.js" defer></script>
</body>
</html>
