openapi: 3.1.0
info:
  title: TodayInfo Global Managed API
  version: 0.8.0
  description: Published-only global content API for TodayInfo. Drafts and raw imports are never returned by public content/search endpoints.
servers:
  - url: https://todayinfos.onrender.com/api/v1
paths:
  /meta:
    get:
      summary: API capabilities, supported content types and filters
      responses:
        '200': {description: API metadata}
  /sources:
    get:
      summary: Categorized public source and integration-capability catalog
      description: Returns source names, categories, regions, content types and operational status. Private import/published counts are not exposed.
      responses:
        '200':
          description: Source catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      categories:
                        type: array
                        items: {$ref: '#/components/schemas/SourceCategory'}
                      sources:
                        type: array
                        items: {$ref: '#/components/schemas/Source'}
                  meta:
                    type: object
                    additionalProperties: true
  /site:
    get:
      summary: Public site configuration
      responses:
        '200': {description: Site information}
  /guides:
    get:
      summary: Published plain-English application guides backed by R2/local JSON artifacts
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: Application guide list}
  /guides/{slug}:
    get:
      summary: One published application guide
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Application guide
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/ApplicationGuide'}
        '404': {description: Guide not found}
  /posts:
    get:
      summary: Published content across all types
      parameters:
        - {$ref: '#/components/parameters/Q'}
        - {$ref: '#/components/parameters/Country'}
        - {$ref: '#/components/parameters/Region'}
        - {$ref: '#/components/parameters/City'}
        - {$ref: '#/components/parameters/Category'}
        - {$ref: '#/components/parameters/Organisation'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {$ref: '#/components/responses/ContentList'}
  /search:
    get:
      summary: Search published content with structured relevance ranking
      parameters:
        - {$ref: '#/components/parameters/Q'}
        - {$ref: '#/components/parameters/Country'}
        - {$ref: '#/components/parameters/Region'}
        - {$ref: '#/components/parameters/City'}
        - {$ref: '#/components/parameters/Category'}
        - {$ref: '#/components/parameters/Subcategory'}
        - {$ref: '#/components/parameters/Organisation'}
        - {$ref: '#/components/parameters/FieldOfStudy'}
        - {$ref: '#/components/parameters/EducationLevel'}
        - {$ref: '#/components/parameters/JobType'}
        - {$ref: '#/components/parameters/WorkMode'}
        - {$ref: '#/components/parameters/ClosingBefore'}
        - {$ref: '#/components/parameters/ClosingAfter'}
      responses:
        '200': {$ref: '#/components/responses/ContentList'}
  /trending:
    get:
      summary: Engagement-ranked published content
      parameters:
        - {$ref: '#/components/parameters/Country'}
        - {$ref: '#/components/parameters/Region'}
        - {name: type, in: query, schema: {type: string}, description: Optional content type such as bursary, job or internship}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {$ref: '#/components/responses/ContentList'}
  /trending/{countryCode}:
    get:
      summary: Trending published content in one country
      parameters:
        - {name: countryCode, in: path, required: true, schema: {type: string, minLength: 2, maxLength: 3}}
      responses:
        '200': {$ref: '#/components/responses/ContentList'}
  /trending/{countryCode}/{region}:
    get:
      summary: Trending published content in a country and region/state/province
      parameters:
        - {name: countryCode, in: path, required: true, schema: {type: string}}
        - {name: region, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/ContentList'}
  /personalized:
    get:
      summary: Deterministic anonymous recommendations based on a visitor's own recent activity
      parameters:
        - {name: visitor_id, in: query, required: true, schema: {type: string, maxLength: 120}}
        - {$ref: '#/components/parameters/Country'}
        - {$ref: '#/components/parameters/Region'}
      responses:
        '200': {$ref: '#/components/responses/ContentList'}
        '400': {description: visitor_id is required}
  /facets:
    get:
      summary: Counts for frontend filter controls
      parameters:
        - {$ref: '#/components/parameters/Country'}
        - {$ref: '#/components/parameters/Region'}
        - {$ref: '#/components/parameters/Category'}
      responses:
        '200': {description: Filter facets}
  /locations:
    get:
      summary: Countries, regions and cities represented by published content
      parameters:
        - {$ref: '#/components/parameters/Country'}
      responses:
        '200': {description: Location hierarchy}
  /countries:
    get:
      summary: Countries represented by published content
      responses:
        '200': {description: Country counts}
  /{countryCode}/{collection}:
    get:
      summary: Country-prefixed collection such as /za/bursaries or /uk/jobs
      parameters:
        - {name: countryCode, in: path, required: true, schema: {type: string}}
        - {name: collection, in: path, required: true, schema: {type: string, enum: [news, announcements, stories, articles, bursaries, scholarships, jobs, internships, learnerships, opportunities]}}
        - {$ref: '#/components/parameters/Q'}
        - {$ref: '#/components/parameters/Region'}
        - {$ref: '#/components/parameters/City'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {$ref: '#/components/responses/ContentList'}
  /{countryCode}/{collection}/{slug}:
    get:
      summary: Country-prefixed published content detail
      parameters:
        - {name: countryCode, in: path, required: true, schema: {type: string}}
        - {name: collection, in: path, required: true, schema: {type: string}}
        - {name: slug, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Structured content detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/ContentDetail'}
        '404': {description: Not found}
  /analytics/events:
    post:
      summary: Record anonymous engagement for analytics, trending, personalization and missing-content demand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visitor_id: {type: string, maxLength: 120}
                event_type: {type: string, enum: [view, read, search, application_click, download, related_click, recommendation_click, tag_click]}
                post_id: {type: string}
                meta: {type: object, additionalProperties: true, description: For related/recommendation clicks, send target_url, target_title and optional target_type so missing content can enter the private demand queue.}
              required: [event_type]
      responses:
        '202': {description: Accepted}
components:
  parameters:
    Q: {name: q, in: query, schema: {type: string}, description: Keyword query}
    Country: {name: country, in: query, schema: {type: string}, description: ISO-style country code or known country name}
    Region: {name: region, in: query, schema: {type: string}, description: Province/state/region name or code}
    City: {name: city, in: query, schema: {type: string}}
    Category: {name: category, in: query, schema: {type: string}}
    Subcategory: {name: subcategory, in: query, schema: {type: string}}
    Organisation: {name: organisation, in: query, schema: {type: string}}
    FieldOfStudy: {name: field_of_study, in: query, schema: {type: string}}
    EducationLevel: {name: education_level, in: query, schema: {type: string}}
    JobType: {name: job_type, in: query, schema: {type: string}}
    WorkMode: {name: work_mode, in: query, schema: {type: string}, description: remote, hybrid or on-site}
    ClosingBefore: {name: closing_before, in: query, schema: {type: string, format: date}}
    ClosingAfter: {name: closing_after, in: query, schema: {type: string, format: date}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
  responses:
    ContentList:
      description: Published content list
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: {$ref: '#/components/schemas/ContentSummary'}
              meta: {type: object, additionalProperties: true}
  schemas:
    SourceCategory:
      type: object
      properties:
        id: {type: string}
        label: {type: string}
        description: {type: string}
    Source:
      type: object
      properties:
        id: {type: string}
        label: {type: string}
        category: {type: string}
        region: {type: string}
        country_code: {type: [string, 'null']}
        content_types: {type: array, items: {type: string}}
        mode: {type: string}
        integration_status: {type: string, enum: [active, discovery, credentials_required, licence_required]}
        description: {type: string}
        homepage: {type: string, format: uri}
        operational: {type: boolean}
        operation: {type: [string, 'null']}
    Location:
      type: object
      properties:
        country:
          type: object
          properties:
            code: {type: [string, 'null']}
            name: {type: [string, 'null']}
        region:
          type: object
          properties:
            code: {type: [string, 'null']}
            name: {type: [string, 'null']}
        city: {type: [string, 'null']}
        location: {type: [string, 'null']}
    Classification:
      type: object
      properties:
        subcategory: {type: [string, 'null']}
        opportunity_type: {type: [string, 'null']}
        organisation: {type: [string, 'null']}
        education_level: {type: array, items: {type: string}}
        fields_of_study: {type: array, items: {type: string}}
        job_type: {type: [string, 'null']}
        work_mode: {type: [string, 'null']}
        salary: {type: object, additionalProperties: true}
        eligibility_tags: {type: array, items: {type: string}}
        keywords: {type: array, items: {type: string}}
    ApplicationGuide:
      type: object
      properties:
        id: {type: string}
        type: {type: string, const: application_guide}
        slug: {type: string}
        path: {type: string}
        title: {type: string}
        description: {type: string}
        parent: {type: object, additionalProperties: true}
        steps: {type: array, items: {type: string}}
        supporting_documents: {type: array, items: {type: string}}
        requirements: {type: string}
        official_application_url: {type: [string, 'null']}
        verification: {type: [object, 'null'], additionalProperties: true}
        source: {type: [object, 'null'], additionalProperties: true}
    ContentSummary:
      type: object
      properties:
        id: {type: string}
        type: {type: string}
        slug: {type: string}
        path: {type: string}
        legacy_path: {type: string}
        title: {type: string}
        description: {type: string}
        posted_date: {type: [string, 'null']}
        updated_date: {type: [string, 'null']}
        category: {type: [string, 'null']}
        subcategory: {type: [string, 'null']}
        location: {$ref: '#/components/schemas/Location'}
        classification: {$ref: '#/components/schemas/Classification'}
        organisation: {type: [string, 'null']}
        publishing_status: {type: string, const: published}
        seo: {type: object, additionalProperties: true}
        tracking: {type: object, additionalProperties: true}
    ContentDetail:
      allOf:
        - {$ref: '#/components/schemas/ContentSummary'}
        - type: object
          properties:
            metadata: {type: object, additionalProperties: true}
            body: {type: object, additionalProperties: true}
            topics: {type: array, items: {type: object, additionalProperties: true}}
            related_links: {type: array, items: {type: object, additionalProperties: true}}
            recommendation_links: {type: array, items: {type: object, additionalProperties: true}}
            related_content: {type: array, items: {$ref: '#/components/schemas/ContentSummary'}}
            recommendations: {type: array, items: {$ref: '#/components/schemas/ContentSummary'}}
            navigation: {type: object, additionalProperties: true}
            relation_meta: {type: object, additionalProperties: true}
            application_tracking: {type: [object, 'null'], additionalProperties: true}
