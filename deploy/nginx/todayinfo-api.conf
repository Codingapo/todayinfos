# /etc/nginx/sites-available/todayinfo-api
# TodayInfo API reverse proxy. Node listens only on 127.0.0.1:3009.

server {
    listen 80;
    listen [::]:80;
    server_name api.todayinfo.co.za;

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;

        # Let the Node API decide cacheability with Cache-Control and
        # Cloudflare-CDN-Cache-Control. Never force-cache admin/auth here.
        proxy_buffering on;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;
}
