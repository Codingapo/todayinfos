# /etc/nginx/sites-available/todayinfo
# TodayInfo single-VPS deployment.
# Frontend: https://todayinfo.co.za
# Admin:    https://todayinfo.co.za/admin/
# API:      https://api.todayinfo.co.za
# Node:     http://127.0.0.1:3011

proxy_cache_path /var/cache/nginx/todayinfo
    levels=1:2
    keys_zone=todayinfo_api_cache:50m
    max_size=512m
    inactive=60m
    use_temp_path=off;

# Public site + admin. Certbot can add HTTPS to this server block.
server {
    listen 80;
    listen [::]:80;
    server_name todayinfo.co.za www.todayinfo.co.za;

    root /var/www/today/frontend;
    index index.html;
    client_max_body_size 30m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Admin stays on the main domain but is served by the Node application.
    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_buffering on;
        add_header Cache-Control "no-store" always;
    }

    # Local upload fallback remains reachable when R2/Supabase storage is not used.
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache off;
        expires 1h;
    }

    # Runtime API config must be easy to change without stale browser copies.
    location = /data/api-config.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Frontend JS/CSS/images: cache for speed, but not forever because filenames are versioned manually.
    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
    }

    location = /robots.txt {
        try_files $uri =404;
        expires 1h;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        expires 1h;
    }

    # SPA fallback fixes /jobs, /bursaries, /za/jobs/... and other extension-free routes.
    # No more "Cannot GET /route" from the public frontend.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}

# Public API. Certbot can add HTTPS to this server block.
server {
    listen 80;
    listen [::]:80;
    server_name api.todayinfo.co.za;

    client_max_body_size 30m;

    # Public GET/HEAD API responses use both Node Cache-Control and Nginx disk cache.
    # Nginx respects upstream no-store/private headers, so personalized requests are not shared-cached.
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_cache todayinfo_api_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_lock on;
        proxy_cache_revalidate on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
        proxy_cache_valid 200 2m;
        proxy_cache_valid 404 15s;

        add_header X-TodayInfo-Cache $upstream_cache_status always;
    }

    # Admin is canonical on todayinfo.co.za/admin.
    location = /admin {
        return 308 https://todayinfo.co.za/admin/;
    }

    location ^~ /admin/ {
        return 308 https://todayinfo.co.za$request_uri;
    }

    # Private ingestion and health must never be shared-cached.
    location ^~ /internal/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3011/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    location = /openapi.yaml {
        proxy_pass http://127.0.0.1:3011/openapi.yaml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache todayinfo_api_cache;
        proxy_cache_valid 200 5m;
    }

    location = /api-info {
        proxy_pass http://127.0.0.1:3011/api-info;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache todayinfo_api_cache;
        proxy_cache_valid 200 1m;
    }

    location = / {
        return 302 /api-info;
    }

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;
}
