# /etc/nginx/sites-available/todayinfo
# TodayInfo single-VPS deployment.
#
# Public frontend:
#   https://todayinfo.co.za          -> 127.0.0.1:3011
#
# Dedicated admin UI:
#   https://admin.todayinfo.co.za    -> 127.0.0.1:3011 (/admin/ internally)
#
# API + admin API:
#   https://api.todayinfo.co.za      -> 127.0.0.1:3009
#
# IMPORTANT:
# /admin/api/* must stay on api.todayinfo.co.za. Do not redirect it to the
# frontend host, because the dashboard uses credentialed cross-subdomain fetch.

proxy_cache_path /var/cache/nginx/todayinfo
    levels=1:2
    keys_zone=todayinfo_api_cache:50m
    max_size=512m
    inactive=60m
    use_temp_path=off;

# ---------------------------------------------------------------------------
# Public site + admin UI
# Certbot can add HTTPS to this server block.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name todayinfo.co.za www.todayinfo.co.za;

    client_max_body_size 30m;

    # Local upload fallback is owned by the API process.
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        expires 1h;
    }

    # Keep the admin UI canonical on the dedicated admin hostname.
    location = /admin {
        return 308 https://admin.todayinfo.co.za/;
    }

    location ^~ /admin/ {
        return 308 https://admin.todayinfo.co.za/;
    }

    # Everything else is served by the dedicated public frontend process.
    # Its Helmet CSP explicitly allows api.todayinfo.co.za.
    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_buffering on;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}

# ---------------------------------------------------------------------------
# Dedicated admin UI
# Certbot can add HTTPS to this server block.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name admin.todayinfo.co.za;

    client_max_body_size 30m;

    # Canonical admin URL is the subdomain root.
    location = / {
        proxy_pass http://127.0.0.1:3011/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    # Admin static assets are still mounted by the frontend process at /admin/.
    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    # Do not expose the public SPA through the admin hostname.
    location / {
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}

# ---------------------------------------------------------------------------
# API + private admin API
# Certbot can add HTTPS to this server block.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.todayinfo.co.za;

    client_max_body_size 30m;

    # Public GET/HEAD API responses use Node Cache-Control plus Nginx disk cache.
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_cache todayinfo_api_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_lock on;
        proxy_cache_revalidate on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
        proxy_cache_valid 200 2m;
        proxy_cache_valid 404 15s;

        add_header X-TodayInfo-Cache $upstream_cache_status always;
    }

    # Credentialed admin API. This MUST be proxied to the API process and must
    # never be redirected or shared-cached.
    location ^~ /admin/api/ {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # The admin UI is canonical on the dedicated admin hostname.
    location = /admin {
        return 308 https://admin.todayinfo.co.za/;
    }

    location = /admin/ {
        return 308 https://admin.todayinfo.co.za/;
    }

    # Any accidental admin UI path goes to the dedicated admin hostname, but
    # the longer /admin/api/ location above always wins for API calls.
    location ^~ /admin/ {
        return 308 https://admin.todayinfo.co.za/;
    }

    # Private ingestion and health are never shared-cached.
    location ^~ /internal/ {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3009/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    location = /openapi.yaml {
        proxy_pass http://127.0.0.1:3009/openapi.yaml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache todayinfo_api_cache;
        proxy_cache_valid 200 5m;
    }

    location = /api-info {
        proxy_pass http://127.0.0.1:3009/api-info;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache todayinfo_api_cache;
        proxy_cache_valid 200 1m;
    }

    location = / {
        return 302 /api-info;
    }

    # API fallthrough for other non-cached API-owned routes such as uploads.
    location / {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;
}
